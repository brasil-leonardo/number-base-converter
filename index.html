<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" type="text/css">
    <link rel="shortcut icon" href="assets/icon.ico" type="image/x-icon">
    <title>Number Base Converter</title>
</head>

<body>
    <div class="container">
        <h1>Number Base Converter</h1>
        <p>
            This project is a numeric base converter, created as a simple and practical program to help programmers in
            their daily work.
            It is hable to convert numbers in binary, octal, decimal and hexadecimal numerical bases.
        </p>
        <table>
            <tr>
                <th><label for="binary">Binary</label></th>
                <td><input type="radio" name="input-base" id="binary"></td>
                <td><input type="text" name="binary-value" id="binary-value"></td>
            </tr>
            <tr>
                <th><label for="octal">Octal</label></th>
                <td><input type="radio" name="input-base" id="octal"></td>
                <td><input type="text" name="octal-value" id="octal-value"></td>
            </tr>
            <tr>
                <th><label for="decimal">Decimal</label></th>
                <td><input type="radio" name="input-base" id="decimal"></td>
                <td><input type="text" name="decimal-value" id="decimal-value"></td>
            </tr>
            <tr>
                <th><label for="hexadecimal">Hexadecimal</label></th>
                <td><input type="radio" name="input-base" id="hexadecimal"></td>
                <td><input type="text" name="hexadecimal-value" id="hexadecimal-value"></td>
            </tr>
        </table>
    </div>
    <script src="script.js"></script>
</body>

</html>
